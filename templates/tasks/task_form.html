{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Manage Task - Taskly{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white p-4 rounded-top-4">
                <h3 class="fw-bold mb-0">{% if object %}Edit Task{% else %}New Task{% endif %}</h3>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'tasks:list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
