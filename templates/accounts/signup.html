{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Join Manohar's Taskly</h2>
            <p class="text-muted">Create an account to start collaborating</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary w-100 mt-3 py-2">Create Account</button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Already have an account? <a href="{% url 'accounts:login' %}"
                    class="text-primary text-decoration-none fw-semibold">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
